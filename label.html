<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhãn vận chuyển</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Google+Sans+Code:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  @page { size: A5 landscape; margin: 6mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e9e9e6; color: #111; font-family: "Be Vietnam Pro", Arial, sans-serif; font-size: 11pt; }
  .bar { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 12px 16px; }
  .bar button { font: inherit; font-weight: 600; padding: 8px 20px; border: 0; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
  .bar span { color: #555; font-size: 10pt; }
  .sheet { width: 210mm; height: 148mm; margin: 0 auto 24px; background: #fff; padding: 6mm; box-shadow: 0 1px 6px rgba(0,0,0,.15); display: flex; flex-direction: column; overflow: hidden; }
  /* Khớp mẫu WH-OUT-00009: ảnh đầu phiếu (logo + tên shop + PHIẾU GỬI HÀNG) 162 x 32 mm, QR 25,9 mm. */
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2.5mm; }
  header img.hdr { width: 162mm; height: 32mm; display: block; margin-left: .9mm; }
  .qr { width: 25.9mm; text-align: center; }
  .qr img { width: 25.9mm; height: 25.9mm; image-rendering: pixelated; display: block; }
  .mono { font-family: "Google Sans Code", ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
  .qr .ma { font-size: 18pt; line-height: 1.1; margin-top: .8mm; }
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .left { padding-right: 4mm; border-right: 1.5px solid #111; display: flex; flex-direction: column; min-height: 0; }
  .right { padding-left: 4mm; display: flex; flex-direction: column; min-height: 0; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 800; padding: 1mm 0; border-bottom: 1.5px solid #111; }
  th:last-child, td:last-child { text-align: right; width: 18mm; }
  td { height: 6.5mm; padding: 0 1mm 0 0; border-bottom: 1px solid #111; font-variant-numeric: tabular-nums; vertical-align: middle; }
  .many td { height: 5mm; font-size: 8.5pt; }
  /* Như mẫu Sheet: các dòng cách đều nhau, riêng dòng kẻ cuối cao gấp đôi. */
  tr.dbl td { height: 13mm; }
  /* Như mẫu Sheet (hàng 15-17): ô Ghi chú luôn cao 3 dòng, chữ bắt đầu từ trên. */
  .row.gcrow { align-items: start; }
  .row.gcrow .val { min-height: 19.5mm; }
  .nd { white-space: pre-wrap; padding-top: 1.5mm; }
  .grow { flex: 1; }
  .row { margin: 1.2mm 0; display: grid; grid-template-columns: 24mm 1fr; align-items: baseline; }
  .right .row { grid-template-columns: 27mm 1fr; }
  .row b { white-space: nowrap; }
  .right .row b { font-size: 12pt; }
  .row b { font-weight: 800; }
  .val { white-space: pre-wrap; word-break: break-word; }
  .big { font-size: 18pt; font-weight: 600; }
  #tong { font-size: 15pt; }
  #gc { font-size: 16pt; font-weight: 400; }
  #gc.small { font-size: 10pt; font-weight: 400; line-height: 1.25; }
  .addr { font-size: 18pt; text-transform: uppercase; line-height: 1.2; }
  .box { border: 3px double #111; margin-top: auto; padding: 2mm; text-align: center; min-height: 26mm; display: flex; flex-direction: column; justify-content: center; }
  .box .tt { font-size: 34pt; font-weight: 800; line-height: 1.1; text-transform: uppercase; white-space: nowrap; }
  #nn { text-transform: uppercase; }
  .box .st { font-size: 20pt; font-weight: 800; margin-top: 1mm; }
  .cuoc { font-weight: 600; font-size: 15pt; margin: 2mm 0 1mm; min-height: 5mm; }
  .xe { font-size: 22pt; font-weight: 800; min-height: 8mm; }
  .xe span { text-transform: uppercase; }
  .code { text-align: right; font-size: 12pt; margin-top: 1mm; font-weight: 400; }
  .empty { padding: 30mm 0; text-align: center; color: #a00; }
  .thieu { margin: 20mm auto; max-width: 150mm; border: 3px solid #c00; border-radius: 8px; padding: 8mm 10mm; color: #a00; background: #fff5f5; }
  .thieu h1 { font-size: 20pt; margin: 0 0 4mm; }
  .thieu ul { font-size: 15pt; font-weight: 600; margin: 0 0 5mm; padding-left: 7mm; }
  .thieu p { font-size: 12pt; color: #333; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .bar { display: none; }
    .sheet { width: auto; height: 136mm; margin: 0; padding: 0; box-shadow: none; }
  }
</style>
</head>

<script>
  // Dữ liệu đến từ phần sau dấu # của link (Lark formula ENCODEURL), không gửi lên server nào.
  const p = new URLSearchParams(location.hash.slice(1));
  const g = k => (p.get(k) || "").trim();
  const set = (id, v) => { document.getElementById(id).textContent = v || ""; };
  ["nn", "dt", "dc"].forEach(k => set(k, g(k)));
  set("nl", g("nlt") || g("nl"));
  const ma = g("ma");
  if (ma) {
    document.title = "Nhãn " + ma;
    // Chữ in: mã ngắn 6 ký tự, bỏ "PDH" (PDH00030 -> 000030). QR vẫn chứa mã đầy đủ để quét ra search trong Base.
    const ngan = ma.replace(/^PDH-?/i, "");
    const ma6 = /^\d+$/.test(ngan) ? ngan.padStart(6, "0") : ngan.slice(-6);
    set("ma", ma6);
    set("code", ma6);
    try {
      const qr = qrcode(0, "M"); qr.addData(ma); qr.make();
      document.getElementById("qr").src = qr.createDataURL(8, 0);
    } catch (e) { console.error("QR", e); }
  }
  const num = v => { const n = Number(String(v || "").replace(/[^0-9.-]/g, "")); return Number.isFinite(n) ? n : 0; };
  const fmt = n => n.toLocaleString("vi-VN") + " đ";

  // Bảng sản phẩm, luôn đủ 7 dòng kẻ như mẫu cũ.
  const tbody = document.getElementById("items");
  let total = 0, count = 0;
  const addRow = (name, qty) => {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = name;
    const b = document.createElement("td"); b.textContent = qty;
    tr.append(a, b); tbody.append(tr);
  };
  // Mỗi dòng: Tên~Số lượng~Trọng lượng(kg)~Ghi chú dòng (bản cũ chỉ có Tên~Số lượng).
  let kgSum = 0;
  g("sp").split("|").map(s => s.trim()).filter(Boolean).forEach(line => {
    const [name, qty = "", kg = "", ...rest] = line.split("~");
    if (!name.trim()) return; // dòng trống trong Danh sách hàng hóa (chưa chọn sản phẩm) -> bỏ qua
    const note = rest.join("~").trim();
    const q = qty.trim();
    if (q !== "" && Number.isFinite(Number(q))) total += Number(q);
    kgSum += num(kg);
    addRow(note ? `${name.trim()} (${note})` : name.trim(), q);
    count++;
  });
  // Đơn chưa có dòng chi tiết: KHÔNG đoán sản phẩm/kg từ chữ. Để trống dòng kẻ cho ghi tay,
  // còn "Nội dung đơn hàng" in nguyên văn ở Ghi chú.
  const coDong = count > 0;
  if (count > 7) document.getElementById("tbl").classList.add("many");
  for (let k = count; k < 7; k++) addRow("", "");
  if (count < 7) tbody.lastElementChild.classList.add("dbl");

  // Tổng cộng (kg): chỉ lấy từ số liệu thật: Trọng lượng các dòng, rồi Trọng lượng của phiếu,
  // rồi tổng số lượng các dòng (số lượng tính theo kg như mẫu cũ). Không có thì để trống.
  const kg = Math.round((kgSum || num(g("tl")) || (coDong ? total : 0)) * 100) / 100;
  set("tong", kg ? kg.toLocaleString("vi-VN") + " kg" : "");

  // Ghi chú: "Hẹn gửi ngày dd/mm/yy, <ghi chú giao>" + nội dung đơn (đơn chưa có dòng chi tiết).
  const hg = g("hg") || g("hx");
  const gcLine = [hg ? "Hẹn gửi ngày " + hg : "", g("gg") || g("gc")].filter(Boolean).join(", ");
  const nd = coDong ? "" : g("nd");
  set("gc", [gcLine, nd].filter(Boolean).join("\n"));
  if (nd) document.getElementById("gc").classList.add("small");

  // Ô thanh toán (IN HOA): gửi chành xe -> THU HỘ; khách đến lấy / tự vận chuyển -> CẦN THU;
  // Công nợ -> ĐÃ THANH TOÁN (nhà xe không thu).
  const tt = g("tt");
  const cx = g("cx");
  // "Khách đến lấy", "KHÁCH GHÉ LẤY", "Lấy tại lò", "Tự vận chuyển"... đều là không gửi nhà xe.
  const tuLay = /lấy|tự vận chuyển|tự giao/i.test(cx);
  const can = Math.max(0, num(g("tien")) - num(g("coc")));
  const thu = /thu hộ|cần thu/i.test(tt);
  const daTra = /đã thanh toán|công nợ/i.test(tt);
  set("tt", thu ? (tuLay ? "Cần thu" : "Thu hộ") : daTra ? "Đã thanh toán" : tt);
  // Thu hộ: chỉ in số khi đơn có số tiền thật; chưa có thì để chỗ trống ghi tay, KHÔNG in 0 đ.
  if (thu) set("st", can > 0 ? fmt(can) : "………………… đ");
  else if (daTra) set("st", fmt(0));

  // Tiền xe + chành xe.
  const tc = g("tc");
  set("cuoc", /shop/i.test(tc) ? "Tiền xe shop trả" : /khách/i.test(tc) ? "Tiền xe khách trả" : tc);
  const xe = document.getElementById("xe");
  if (cx && !tuLay) {
    const s = document.createElement("span"); s.textContent = cx;
    xe.append("Gửi xe ", s);
  } else set("xe", cx);
  // Chặn in khi đơn chưa điền đủ (yêu cầu của Đạt): Chành xe, Người trả cước, ít nhất 1 dòng hàng hóa.
  const thieu = [];
  if (!coDong) thieu.push("sản phẩm trong Danh sách hàng hóa");
  if (!cx) thieu.push("Chành xe");
  if (!tc) thieu.push("Người trả cước");
  if (ma && thieu.length) {
    const box = document.createElement("div"); box.className = "thieu";
    const h = document.createElement("h1"); h.textContent = "Đơn " + (document.getElementById("ma").textContent || ma) + " chưa điền đủ thông tin yêu cầu";
    const ul = document.createElement("ul");
    thieu.forEach(t => { const li = document.createElement("li"); li.textContent = "Thiếu " + t; ul.append(li); });
    const pp = document.createElement("p"); pp.textContent = "Quay lại Lark Base điền đủ các mục trên, rồi bấm “In đơn hàng” lại.";
    box.append(h, ul, pp);
    document.getElementById("sheet").replaceWith(box);
    document.querySelector(".bar").remove();
    document.title = "Chưa in được " + ma;
  }
  if (!ma) document.getElementById("sheet").innerHTML = '<div class="empty">Không có dữ liệu đơn. Mở trang này từ nút “In đơn hàng” trong Lark Base.</div>';
  // Co chữ cho vừa ô (không để chữ tràn/đè viền): chữ THU HỘ / ĐÃ THANH TOÁN luôn 1 dòng,
  // địa chỉ dài thì nhỏ dần cho đến khi cột phải vừa trang. Cỡ gốc = cỡ trong Google Sheet.
  const fit = () => {
    const shrink = (el, ok, min) => {
      let pt = parseFloat(getComputedStyle(el).fontSize) * 0.75;
      while (!ok() && pt > min) { pt -= 1; el.style.fontSize = pt + "pt"; }
    };
    const ttEl = document.getElementById("tt");
    if (ttEl) shrink(ttEl, () => ttEl.scrollWidth <= ttEl.clientWidth, 16);
    const right = document.querySelector(".right");
    const fits = () => right.scrollHeight <= right.clientHeight + 1;
    const dcEl = document.getElementById("dc");
    if (right && dcEl) shrink(dcEl, fits, 11);
    const nnEl = document.getElementById("nn");
    if (right && nnEl) shrink(nnEl, fits, 12);
  };
  const ready = (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
  const btn = document.getElementById("print");
  if (btn) btn.addEventListener("click", () => window.print());
  if (p.get("auto") === "1" && !thieu.length) window.addEventListener("load", () => ready.then(() => setTimeout(() => window.print(), 400)));
</script>
</body>
</html>
